services:
  postgres:
    image: postgres:17.5-alpine
    container_name: content-engagement-postgres
    environment:
      POSTGRES_DB: content_engagement
      POSTGRES_USER: content_engagement
      POSTGRES_PASSWORD: local_development_password
    ports:
      - "5433:5432"
    volumes:
      - content-engagement-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U content_engagement -d content_engagement"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    container_name: content-engagement-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: content_engagement
      RABBITMQ_DEFAULT_PASS: local_development_password
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  redis:
    image: redis:8.2-alpine
    container_name: content-engagement-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  leaderboard-postgres:
    image: postgres:17.5-alpine
    container_name: content-engagement-leaderboard-postgres
    environment:
      POSTGRES_DB: leaderboard
      POSTGRES_USER: leaderboard
      POSTGRES_PASSWORD: local_development_password
    ports:
      - "5434:5432"
    volumes:
      - content-engagement-leaderboard-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leaderboard -d leaderboard"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  leaderboard-redis:
    image: redis:8.2-alpine
    container_name: content-engagement-leaderboard-redis
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  leaderboard-service:
    build:
      context: ./leaderboard-service
    container_name: content-engagement-leaderboard-service
    environment:
      LEADERBOARD_DATABASE_URL: jdbc:postgresql://leaderboard-postgres:5432/leaderboard
      LEADERBOARD_DATABASE_USERNAME: leaderboard
      LEADERBOARD_DATABASE_PASSWORD: local_development_password
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: content_engagement
      RABBITMQ_PASSWORD: local_development_password
      LEADERBOARD_REDIS_HOST: leaderboard-redis
      LEADERBOARD_REDIS_PORT: 6379
    ports:
      - "8082:8082"
    depends_on:
      leaderboard-postgres:
        condition: service_healthy
      leaderboard-redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.153.0
    profiles: ["observability"]
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    volumes:
      - ./ops/observability/otel-collector.yml:/etc/otelcol-contrib/config.yml:ro
    ports:
      - "4318:4318"
    depends_on:
      tempo:
        condition: service_started

  tempo:
    image: grafana/tempo:2.10.5
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./ops/observability/tempo.yml:/etc/tempo.yml:ro
      - content-engagement-tempo-data:/var/tempo
    ports:
      - "3200:3200"

  prometheus:
    image: prom/prometheus:v3.13.0
    profiles: ["observability"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    volumes:
      - ./ops/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - content-engagement-prometheus-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:13.1.0
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local_development_password}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./ops/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - content-engagement-grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo

  k6:
    image: grafana/k6:2.0.0
    profiles: ["load"]
    environment:
      BASE_URL: ${K6_BASE_URL:-http://host.docker.internal:8081}
      LOAD_PROFILE: ${LOAD_PROFILE:-baseline}
    volumes:
      - ./ops/load/k6:/scripts:ro
      - ./build/load-results:/results
    command: ["run", "--summary-export=/results/summary.json", "/scripts/stage9-load.js"]

volumes:
  content-engagement-postgres-data:
  content-engagement-leaderboard-postgres-data:
  content-engagement-prometheus-data:
  content-engagement-tempo-data:
  content-engagement-grafana-data:
