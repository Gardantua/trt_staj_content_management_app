spring:
  config:
    activate:
      on-profile: prod

app:
  security:
    csrf-enabled: true
  media:
    storage-directory: /data/media
  leaderboard:
    remote-enabled: true

server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        same-site: strict
        secure: true
