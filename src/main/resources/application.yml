spring:
  application:
    name: content-engagement-platform
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/content_engagement}
    username: ${DATABASE_USERNAME:content_engagement}
    password: ${DATABASE_PASSWORD:local_development_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5673}
    username: ${RABBITMQ_USERNAME:content_engagement}
    password: ${RABBITMQ_PASSWORD:local_development_password}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 200ms
          multiplier: 2
          max-interval: 1s
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      connect-timeout: 500ms
      timeout: 500ms
      repositories:
        enabled: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

app:
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    capacity: ${RATE_LIMIT_CAPACITY:60}
    refill-tokens: ${RATE_LIMIT_REFILL_TOKENS:60}
    refill-period: ${RATE_LIMIT_REFILL_PERIOD:1m}
    max-tracked-clients: ${RATE_LIMIT_MAX_TRACKED_CLIENTS:10000}
  media:
    storage-directory: ${MEDIA_STORAGE_DIRECTORY:${java.io.tmpdir}/content-engagement-media}
  messaging:
    rabbit-enabled: ${RABBITMQ_ENABLED:true}
    publisher-delay: ${OUTBOX_PUBLISHER_DELAY:1000}
    publisher-batch-size: ${OUTBOX_PUBLISHER_BATCH_SIZE:25}
  leaderboard:
    redis-enabled: ${LEADERBOARD_REDIS_ENABLED:true}
    refresh-enabled: ${LEADERBOARD_REFRESH_ENABLED:true}
    refresh-delay: ${LEADERBOARD_REFRESH_DELAY:5s}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.95,0.99
      slo:
        http.server.requests: 100ms,250ms,500ms,1s,2s
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_ARG:0.1}
    export:
      otlp:
        enabled: ${OTEL_TRACING_EXPORT_ENABLED:false}
  opentelemetry:
    resource-attributes:
      service.namespace: content-engagement
      deployment.environment: ${DEPLOYMENT_ENVIRONMENT:local}
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        enabled: false

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-},request=%X{requestTraceId:-},event=%X{eventTraceId:-}] "
  include-application-name: false

server:
  port: ${SERVER_PORT:8081}
  error:
    whitelabel:
      enabled: false

---
spring:
  config:
    activate:
      on-profile: test

app:
  rate-limit:
    enabled: false
  messaging:
    rabbit-enabled: false
  leaderboard:
    redis-enabled: false

management:
  health:
    rabbit:
      enabled: false
    redis:
      enabled: false

---
spring:
  config:
    activate:
      on-profile: observability

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    export:
      otlp:
        enabled: ${OTEL_TRACING_EXPORT_ENABLED:true}
