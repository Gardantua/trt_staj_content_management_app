spring:
  application:
    name: content-engagement-platform
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/content_engagement}
    username: ${DATABASE_USERNAME:content_engagement}
    password: ${DATABASE_PASSWORD:local_development_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

app:
  media:
    storage-directory: ${MEDIA_STORAGE_DIRECTORY:${java.io.tmpdir}/content-engagement-media}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

server:
  port: ${SERVER_PORT:8081}
  error:
    whitelabel:
      enabled: false
